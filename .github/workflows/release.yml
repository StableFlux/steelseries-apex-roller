name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.3). Leave blank for current SHA.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build apex-roller.exe
        run: python build.py

      - name: Determine version label
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "appver=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "appver=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /Q `
            "/DAppVersion=${{ steps.ver.outputs.appver }}" `
            installer\apex-roller.iss
          Get-ChildItem dist | Format-Table Name, Length

      - name: Locate installer
        id: locate
        shell: bash
        run: |
          path=$(ls dist/apex-roller-setup-v*.exe | head -1)
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename ${path})" >> "$GITHUB_OUTPUT"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
